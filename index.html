<style>
/* Layout: a dictionary ledger — control bar on top, three language columns as the spine, flashcard mode as a second tab. */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#18222e; --muted:#5d6b7a; --line:#dde3ea; --soft:#e9eef3;
  --accent:#1f5fbf; --accent-ink:#ffffff;
  --b1:#0f7a6c; --b1-bg:#dff3ef; --b2:#a35a00; --b2-bg:#fbecd7;
  --ok:#1d7a3a; --ok-bg:#e1f4e6;
  --prep:#9b2c8a; --prep-bg:#f8e3f3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-word:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --paper:#17202a; --ink:#e6edf4; --muted:#93a2b2; --line:#2a3642; --soft:#1e2833;
  --accent:#6ea3f0; --accent-ink:#0c1520;
  --b1:#5fd0bf; --b1-bg:#123631; --b2:#f0b260; --b2-bg:#3a2a12; --ok:#6fd38c; --ok-bg:#163522;
  --prep:#f08fdc; --prep-bg:#3a1834; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --paper:#17202a; --ink:#e6edf4; --muted:#93a2b2; --line:#2a3642; --soft:#1e2833;
  --accent:#6ea3f0; --accent-ink:#0c1520;
  --b1:#5fd0bf; --b1-bg:#123631; --b2:#f0b260; --b2-bg:#3a2a12; --ok:#6fd38c; --ok-bg:#163522;
  --prep:#f08fdc; --prep-bg:#3a1834; color-scheme:dark}
*{box-sizing:border-box}
.prep{display:inline-block;font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--prep);background:var(--prep-bg);padding:1px 7px;border-radius:5px;margin-left:6px;white-space:nowrap;vertical-align:2px}
.card .q .prep{font-size:15px;vertical-align:6px}
.legend{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.legend .prep{margin-left:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .langs{display:block;font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:600}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:var(--bg);color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn:hover,.seg button:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.row2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.hidecols{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.tabs{display:flex;gap:4px}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:16px;border:0;background:none;color:var(--muted);padding:6px 10px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* list */
.list{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head,.item{display:grid;grid-template-columns:3.4em minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) 9.5em 2.6em;gap:12px;align-items:center;padding:9px 14px}
.head{background:var(--soft);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.item{border-top:1px solid var(--line)}
.item:hover{background:var(--soft)}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.de{font-family:var(--f-word);font-size:17px;font-weight:600}
.de .art{font-weight:400;color:var(--muted);font-size:15px}
.en,.tr{font-family:var(--f-word);font-size:16px}
.meta{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.lv{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px}
.lv.b1{color:var(--b1);background:var(--b1-bg)} .lv.b2{color:var(--b2);background:var(--b2-bg)}
.topic{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mark{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;color:transparent;font-size:14px;line-height:1;display:grid;place-items:center}
.mark:hover{border-color:var(--ok)}
.item.learned .mark{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.item.learned .de,.item.learned .en,.item.learned .tr{opacity:.55}
.veil{cursor:pointer;border-radius:4px;background:var(--soft);color:transparent;user-select:none}
.veil:hover{outline:1px dashed var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.pager .count{min-width:9em;text-align:center}
.lbl{display:none;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:6px;font-family:var(--f-ui);font-weight:600}

@media (max-width:720px){
  .bar{position:static}
  .head{display:none}
  .item{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"de mark" "en mark" "tr mark" "meta mark";gap:2px 10px;padding:12px 14px}
  .item .num{display:none}
  .item .de{grid-area:de} .item .en{grid-area:en} .item .tr{grid-area:tr}
  .item .meta{grid-area:meta;flex-direction:row;gap:8px;align-items:center;margin-top:4px}
  .item .mark{grid-area:mark;align-self:center}
  .lbl{display:inline}
}

/* cards */
.cardzone{display:flex;flex-direction:column;align-items:center;gap:16px}
.card{width:100%;max-width:560px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;min-height:300px;box-shadow:0 8px 30px -18px rgba(20,40,70,.35)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .q{font-family:var(--f-word);font-size:clamp(26px,5vw,36px);font-weight:600;text-align:center;margin:18px 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.card .qlang{text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.ans{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.ans div{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;align-items:baseline}
.ans .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.ans .v{font-family:var(--f-word);font-size:20px;overflow-wrap:anywhere}
.cardbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cardbtns .btn{min-width:9em}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--paper)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card.flip{transform:scale(.985)}}
</style>

// learned set keyed by German headword
let learned = new Set(store.get('kd_learned',[]));
const st = Object.assign({lv:0,topic:-1,wtype:-1,sort:'topic',hide:{de:false,en:false,tr:false},hideLearned:false,ask:'de',view:'list'}, store.get('kd_state',{}));
st.q=''; let page=0; const PER=100;
const revealed=new Set();

const $=id=>document.getElementById(id);
const topicOrder=T.map((t,i)=>i).sort((a,b)=>T[a].localeCompare(T[b],'tr'));
topicOrder.forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=T[i];$('topic').appendChild(o)});
W.map((w,i)=>i).sort((a,b)=>W[a].localeCompare(W[b],'tr')).forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=W[i];$('wtype').appendChild(o)});
{const o=document.createElement('option');o.value=-2;o.textContent='Edatlı fiiller';$('wtype').appendChild(o)}

const norm=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/ı/g,'i');
const searchIdx=R.map(r=>norm(r[0]+' '+(r[6]||'').replace(/ \+ (Akk|Dat)\./g,'')+' | '+r[1]+' | '+r[2]));
const prepHtml=r=>r[6]?r[6].split(' · ').map(p=>`<span class="prep">${esc(p)}</span>`).join(''):'';
const bare=s=>s.replace(/^(der|die|das|sich|\(das\))\s+/i,'').toLocaleLowerCase('de');
let shuffleKey=R.map(()=>Math.random());
const rankTopic=new Array(T.length); topicOrder.forEach((t,i)=>rankTopic[t]=i);

let view=[];
function compute(){
  const q=norm(st.q.trim());
  let idx=[];
  for(let i=0;i<R.length;i++){
    const r=R[i];
    if(st.lv&&r[3]!==st.lv)continue;
    if(st.topic>=0&&r[4]!=st.topic)continue;
    if(st.wtype>=0&&r[5]!=st.wtype)continue;
    if(st.wtype===-2&&!r[6])continue;
    if(st.hideLearned&&learned.has(r[0]))continue;
    if(q&&!searchIdx[i].includes(q))continue;
    idx.push(i);
  }
  if(st.sort==='alpha') idx.sort((a,b)=>bare(R[a][0]).localeCompare(bare(R[b][0]),'de'));
  else if(st.sort==='shuffle') idx.sort((a,b)=>shuffleKey[a]-shuffleKey[b]);
  else idx.sort((a,b)=>R[a][3]-R[b][3]||rankTopic[R[a][4]]-rankTopic[R[b][4]]||a-b);
  view=idx;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function deHtml(s){const m=s.match(/^(der|die|das|sich)\s+(.*)$/);return m?`<span class="art">${m[1]}</span> ${esc(m[2])}`:esc(s)}
function cell(cls,label,html,i){
  const hid=st.hide[cls]&&!revealed.has(i+cls);
  return `<span class="${cls}${hid?' veil':''}" data-i="${i}" data-c="${cls}"${hid?' title="Görmek için dokun"':''}><span class="lbl">${label}</span>${html}</span>`;
}
function renderList(){
  const pages=Math.max(1,Math.ceil(view.length/PER)); if(page>=pages)page=pages-1;
  const s=page*PER, slice=view.slice(s,s+PER);
  $('rows').innerHTML = slice.length? slice.map((i,k)=>{const r=R[i];const L=learned.has(r[0]);
    return `<div class="item${L?' learned':''}" role="row">
      <span class="num">${s+k+1}</span>
      ${cell('de','DE',deHtml(r[0])+prepHtml(r),i)}${cell('en','EN',esc(r[1]),i)}${cell('tr','TR',esc(r[2]),i)}
      <span class="meta"><span class="lv b${r[3]}">B${r[3]}</span><span class="topic">${esc(T[r[4]])} · ${esc(W[r[5]])}</span></span>
      <button class="mark" data-i="${i}" aria-pressed="${L}" title="${L?'Öğrendim işaretini kaldır':'Öğrendim olarak işaretle'}">✓</button>
    </div>`}).join('') : `<div class="empty">Bu filtrelerle eşleşen kelime yok. Aramayı kısaltmayı ya da konu filtresini kaldırmayı deneyin.</div>`;
  $('count').textContent = `${view.length.toLocaleString('tr')} kelime gösteriliyor`;
  $('pageInfo').textContent = `Sayfa ${page+1} / ${pages}`;
  $('prev').disabled=page===0; $('next').disabled=page>=pages-1;
  $('learnedCount').textContent=learned.size.toLocaleString('tr');
}
// cards
let cpos=0, shown=false;
function renderCard(){
  const c=$('card'), b=$('cardBtns');
  $('learnedCount').textContent=learned.size.toLocaleString('tr');
  $('count').textContent = `${view.length.toLocaleString('tr')} kelime gösteriliyor`;
  if(!view.length){c.innerHTML=`<div class="empty">Bu filtrelerle çalışacak kelime kalmadı. Filtreleri değiştirin ya da “Öğrendiklerimi gösterme” seçeneğini kapatın.</div>`;b.innerHTML='';return}
  if(cpos>=view.length)cpos=0;
  const r=R[view[cpos]], lab={de:'ALMANCA',en:'İNGİLİZCE',tr:'TÜRKÇE'}, val={de:r[0],en:r[1],tr:r[2]};
  const show=x=>x==='de'?esc(r[0])+prepHtml(r):esc(val[x]);
  const others=['de','en','tr'].filter(x=>x!==st.ask);
  c.innerHTML=`<div class="top"><span class="lv b${r[3]}">B${r[3]}</span><span class="num">${cpos+1} / ${view.length.toLocaleString('tr')}</span></div>
    <div class="qlang">${lab[st.ask]}</div><div class="q">${show(st.ask)}</div>
    <div class="topic" style="text-align:center;max-width:none">${esc(T[r[4]])} · ${esc(W[r[5]])}</div>
    ${shown?`<div class="ans">${others.map(o=>`<div><span class="k">${o.toUpperCase()}</span><span class="v">${show(o)}</span></div>`).join('')}</div>`:''}`;
  b.innerHTML= shown? `<button class="btn" id="again">← Tekrar et</button><button class="btn ok" id="know">Biliyorum →</button>`
                    : `<button class="btn primary" id="show">Cevabı göster</button>`;
}
function cardShow(){shown=true;renderCard()}
function cardNext(knew){
  if(!view.length)return;
  const w=R[view[cpos]][0];
  if(knew){learned.add(w);store.set('kd_learned',[...learned]);
    if(st.hideLearned){compute();shown=false;renderCard();return}}
  else{ // push this word a few cards later
    const v=view.splice(cpos,1)[0]; view.splice(Math.min(view.length,cpos+5),0,v); cpos--; }
  cpos++; shown=false; const c=$('card'); c.classList.add('flip'); setTimeout(()=>c.classList.remove('flip'),150); renderCard();
}
function save(){const {q,...rest}=st;store.set('kd_state',rest)}
function refresh(resetPage=true){if(resetPage){page=0;cpos=0;shown=false}compute();st.view==='list'?renderList():renderCard();save()}
function syncControls(){
  document.querySelectorAll('#lvSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===st.lv));
  document.querySelectorAll('#hideSeg button').forEach(b=>b.setAttribute('aria-pressed',st.hide[b.dataset.c]));
  document.querySelectorAll('#askSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a===st.ask));
  $('topic').value=st.topic;$('wtype').value=st.wtype;$('sort').value=st.sort;$('hideLearned').checked=st.hideLearned;
  $('tabList').setAttribute('aria-selected',st.view==='list');$('tabCards').setAttribute('aria-selected',st.view==='cards');
  $('listView').hidden=st.view!=='list';$('cardView').hidden=st.view!=='cards';
  document.querySelector('.hidecols').hidden=st.view!=='list';
}
let tq; $('q').addEventListener('input',e=>{clearTimeout(tq);tq=setTimeout(()=>{st.q=e.target.value;refresh()},140)});
$('lvSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.lv=+b.dataset.v;syncControls();refresh()});
$('hideSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.hide[b.dataset.c]=!st.hide[b.dataset.c];revealed.clear();syncControls();refresh(false)});
$('askSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.ask=b.dataset.a;shown=false;syncControls();renderCard();save()});
$('topic').addEventListener('change',e=>{st.topic=+e.target.value;refresh()});
$('wtype').addEventListener('change',e=>{st.wtype=+e.target.value;refresh()});
$('sort').addEventListener('change',e=>{st.sort=e.target.value;if(st.sort==='shuffle')shuffleKey=R.map(()=>Math.random());refresh()});
$('hideLearned').addEventListener('change',e=>{st.hideLearned=e.target.checked;refresh()});
$('prev').onclick=()=>{page--;renderList();window.scrollTo({top:0})};
$('next').onclick=()=>{page++;renderList();window.scrollTo({top:0})};
$('tabList').onclick=()=>{st.view='list';syncControls();refresh(false)};
$('tabCards').onclick=()=>{st.view='cards';shown=false;syncControls();refresh(false)};
$('rows').addEventListener('click',e=>{
  const m=e.target.closest('.mark');
  if(m){const w=R[+m.dataset.i][0];learned.has(w)?learned.delete(w):learned.add(w);store.set('kd_learned',[...learned]);
    if(st.hideLearned){compute()} renderList();return}
  const v=e.target.closest('.veil'); if(v){revealed.add(v.dataset.i+v.dataset.c);renderList()}
});
$('cardBtns').addEventListener('click',e=>{const id=e.target.id;if(id==='show')cardShow();if(id==='know')cardNext(true);if(id==='again')cardNext(false)});
document.addEventListener('keydown',e=>{
  if(st.view!=='cards'||e.target.matches('input,select,textarea'))return;
  if(e.key===' '){e.preventDefault();if(!shown)cardShow()}
  else if(e.key==='ArrowRight'&&shown)cardNext(true);
  else if(e.key==='ArrowLeft'&&shown)cardNext(false);
});
syncControls(); refresh();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script></html>
